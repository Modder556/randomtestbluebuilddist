name: my-distro
description: My first image.
base-image: ghcr.io/ublue-os/silverblue-main
image-version: latest

modules:
  - type: dnf
    install:
      packages:
        - micro
  - type: gnome-extensions
    install:
      - 1160   # Dash to Panel (taskbar)
      - 3628   # ArcMenu (start menu)
  - type: gschema-overrides
    include:
      - zz1-my-distro.gschema.override
  - type: signing
